version: 1.1
project:
  name: VWA-OS
  evidence_required: true
visual:
  require_image_existence_check: true
  require_post_change_render_check: true
  preferred_viewports: [390, 768, 1024, 1280, 1440]
seo:
  require_title: true
  require_meta_description: true
  require_canonical: true
  require_sitemap: true
quality:
  block_on_broken_images: true
  block_on_build_failure: true
  block_on_unverified_visual_claims: true
